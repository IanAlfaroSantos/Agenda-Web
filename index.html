<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Página Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="index.css">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="max-width: 400px;">
        <div class="text-center mb-4">
            <img src="https://i.ibb.co/hsLnk1F/form.jpg" alt="Formulario" class="img-fluid rounded-circle mb-4" width="150" height="150">
            <h3>Iniciar Sesión</h3>
        </div>
        
        <form action="contactos/contacto.html">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Contraseña</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password1" required>
                    <button type="button" class="btn btn-outline-light btn-light" onclick="togglePassword()">
                        <img src="https://i.ibb.co/bHQNR4t/ver-contrase-a.png" alt="Ver contraseña" width="20">
                    </button>
                </div>
            </div>
            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </div>
            <div class="text-center">
                <p class="text-white-50">¿Olvidaste tu contraseña? <a href="index.html" class="text-white">Recuperala aqui</a></p>
            </div>
        </form>
    </div>

    <script>
        function togglePassword() {
            const verContrasena = document.getElementById('password1');
            const cambio = verContrasena.type === 'password' ? 'text' : 'password';
            verContrasena.type = cambio;
        }
    </script>
</body>
</html>
