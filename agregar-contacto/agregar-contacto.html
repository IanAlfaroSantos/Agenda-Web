<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Formulario Contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="agregar-contacto.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow-lg p-4" style="max-width: 400px;">
        <div class="text-center mb-4">
            <img src="../assets/image/FormNuevoContacto.png" alt="Formulario" class="img-fluid rounded-circle mb-5" width="200" height="200">
            <h3>Agregar Nuevo Contacto</h3>
        </div>
        
        <form action="../contactos/contacto.html">
            <div class="mb-3">
                <label for="inputDpi" class="form-label">DPI</label>
                <input type="text" class="form-control" id="inputDpi" required>
            </div>
            <div class="mb-3">
                <label for="inputNombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="inputNombre" required>
            </div>
            <div class="mb-3">
                <label for="inputDireccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="inputDireccion" required>
            </div>
            <div class="mb-3">
                <label for="inputTelefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="inputTelefono" required>
            </div>
            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary">Guardar Contacto</button>
            </div>
        </form>
        <form action="../contactos/contacto.html">
            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary">Volver a la lista Contactos</button>
            </div>
        </form>
    </div>

</body>
</html>
